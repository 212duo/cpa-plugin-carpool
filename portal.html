<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPA 席位用量查询与自助重置中心</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-hover: #0ea5e9;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 28px;
}
.container {
  width: 100%;
  max-width: 1440px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
}
h1 { font-size: 25px; font-weight: 700; text-align: left; margin-bottom: 8px; color: var(--accent); }
.desc { font-size: 13px; color: var(--muted); text-align: left; margin-bottom: 20px; }
.form-group { display: flex; gap: 8px; margin-bottom: 24px; }
input[type="text"] {
  flex: 1;
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  font-family: monospace;
}
input[type="text"]:focus { border-color: var(--accent); }
button.btn-query {
  background: var(--accent);
  color: #0f172a;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 0 20px;
  cursor: pointer;
  transition: all 0.2s;
}
button.btn-query:hover { background: var(--accent-hover); }
.status-card {
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-top: 16px;
}
.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--muted); font-size: 14px; }
.stat-val { font-weight: 600; font-size: 14px; font-family: monospace; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
.badge-green { background: rgba(34, 197, 94, 0.15); color: var(--green); }
.badge-orange { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
.badge-red { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.reset-sec {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px dashed var(--border);
}
.reset-btn {
  width: 100%;
  padding: 12px;
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid var(--orange);
  color: var(--orange);
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.reset-btn:hover:not(:disabled) {
  background: var(--orange);
  color: #0f172a;
}
.reset-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  border-color: var(--muted);
  color: var(--muted);
  background: transparent;
}
.credit-list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.credit-item {
  background: #070d17;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
}
.credit-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.credit-title {
  font-weight: 600;
  color: var(--text);
  font-size: 13px;
}
.credit-meta {
  color: var(--muted);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.credit-meta div {
  display: flex;
  justify-content: space-between;
}
.credit-meta span.val {
  color: var(--text);
  font-family: monospace;
}
.token-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 6px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.token-col {
  text-align: center;
}
.token-col-mid {
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}
.token-lbl {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 3px;
}
.token-val {
  font-size: 13px;
  font-weight: 600;
  font-family: monospace;
}
.guide-sec {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px dashed var(--border);
}
.sec-title { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.sec-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
.guide-field { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
.guide-field label { color: var(--muted); width: 64px; flex-shrink: 0; }
.guide-field code, .guide-field select, .guide-field input {
  flex: 1;
  min-width: 0;
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  color: var(--text);
  font-family: monospace;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 10px; }
.tab {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 9999px;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
}
.tab.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }
.step { font-size: 12px; color: var(--muted); margin: 12px 0 6px; line-height: 1.5; }
.code-box { position: relative; }
.code-box pre {
  background: #070d17;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  padding-right: 64px;
  font-family: monospace;
  font-size: 12px;
  line-height: 1.55;
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
}
.copy-btn:hover { border-color: var(--accent); }
.guide-steps { margin: 6px 0 0 18px; font-size: 13px; line-height: 1.7; color: var(--text); }
.guide-steps li { margin-bottom: 6px; }
.guide-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
.footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
.alert { padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-size: 13px; }
.alert-ok { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid var(--green); }
.alert-err { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }

.overview-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.overview-grid .status-card { margin:0; min-width:0; }
.panel-title { font-size:15px; font-weight:600; margin-bottom:14px; color:var(--accent); }
.stat-row { gap:12px; flex-wrap:wrap; } .stat-val { overflow-wrap:anywhere; }
.form-group { max-width:820px; } .form-group input { min-width:0; }
input[type="password"] { flex:1; min-width:0; background:#0b1120; border:1px solid var(--border); border-radius:8px; padding:12px 16px; color:var(--text); font:14px monospace; }
.monitor-link { display:inline-block; margin-top:16px; border:1px solid var(--accent); border-radius:8px; background:#12304a; color:var(--accent); padding:9px 16px; cursor:pointer; font:inherit; }
.reset-sec { margin:20px 0 0; padding:20px; border:1px solid var(--border); border-radius:12px; background:#0b1120; }
.credit-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
.guide-details { margin-top:20px; border:1px solid var(--border); border-radius:12px; padding:16px 20px; }
.guide-details summary { cursor:pointer; color:var(--accent); font-weight:600; } .guide-sec { margin-top:12px; padding-top:16px; }
@media(max-width:1050px) { .overview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .overview-grid .status-card:last-child { grid-column:1/-1; } }
@media(max-width:680px) { body { padding:14px; } .container { padding:20px 16px; } h1 { font-size:21px; } .overview-grid { grid-template-columns:1fr; } .overview-grid .status-card:last-child { grid-column:auto; } .credit-list { grid-template-columns:1fr; } .stat-label,.stat-val { font-size:13px; } }
</style>
</head>
<body>
<div class="container">
  <h1>席位用量查询与自助重置中心</h1>
  <p class="desc">输入你的专属客户端 API Key，查询席位额度状态及核销重置卡</p>
  
  <div class="form-group">
    <input type="password" id="apiKeyInput" placeholder="输入 sk-team..." value="" autocomplete="off" spellcheck="false">
    <button class="btn-query" onclick="doQuery()">查询</button>
  </div>

  <div id="resultArea"></div>
</div>

<div class="footer">社区插件 · 非 CLIProxyAPI 官方项目</div>

<script>
// The buyer key travels in the X-Carpool-Key header, never in API URLs, so it stays
// out of gateway access logs. Share links should use #key=... (the fragment is not
// sent to the server); ?key=... still works but is removed from the address bar.
let currentKey = "";
let queryGeneration = 0;

function getUrlKey() {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const query = new URLSearchParams(window.location.search);
  const key = hash.get("key") || query.get("key") || "";
  if (key && (window.location.search || window.location.hash)) {
    history.replaceState(null, "", window.location.pathname);
  }
  return key;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

async function api(path) {
  const res = await fetch(path, {
    cache: "no-store",
    credentials: "omit",
    referrerPolicy: "no-referrer",
    headers: { "X-Carpool-Key": currentKey }
  });
  let data = {};
  try {
    data = await res.json();
  } catch (e) {
    data = { error: "网关返回了无法解析的响应 (HTTP " + res.status + ")" };
  }
  return { res, data };
}

function formatDate(isoStr) {
  if (!isoStr) return "--";
  try {
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    const s = String(d.getSeconds()).padStart(2, "0");
    return `${y}-${m}-${day} ${h}:${min}:${s}`;
  } catch(e) {
    return isoStr;
  }
}

function formatTokensM(tokens) {
  if (tokens === undefined || tokens === null) return "0";
  const num = Number(tokens);
  if (!Number.isFinite(num) || num <= 0) return "0";
  if (num < 1000) return String(Math.floor(num));
  const m = num / 1000000;
  if (m >= 100) return m.toFixed(1) + "M";
  if (m >= 0.01) return m.toFixed(2) + "M";
  return m.toFixed(3) + "M";
}

function formatRemaining5h(targetUnixSec) {
  if (!targetUnixSec) return "--";
  const now = Math.floor(Date.now() / 1000);
  const diff = targetUnixSec - now;
  if (diff <= 0) return "已到达重置点";
  const hours = Math.floor(diff / 3600);
  const mins = Math.floor((diff % 3600) / 60);
  if (hours > 0) {
    return `剩余 ${hours} 小时 ${mins} 分`;
  }
  return `剩余 ${mins} 分`;
}

function formatScheduleWeek(targetUnixSec) {
  if (!targetUnixSec) return "--";
  const d = new Date(targetUnixSec * 1000);
  const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const w = weekdays[d.getDay()];
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const timeStr = `${w} ${hh}:${mm}`;

  const now = Math.floor(Date.now() / 1000);
  const diff = targetUnixSec - now;
  if (diff <= 0) return `${timeStr} (已到达)`;

  const days = Math.floor(diff / 86400);
  const hours = Math.floor((diff % 86400) / 3600);
  if (days > 0) {
    return `${timeStr} (剩余 ${days} 天)`;
  }
  return `${timeStr} (剩余 ${hours} 小时)`;
}

let countdownTimer = null;
function startCountdown(priResetAt, secResetAt) {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    const priEl = document.getElementById("priCountdown");
    const secEl = document.getElementById("secSchedule");
    if (priEl && priResetAt) priEl.textContent = formatRemaining5h(priResetAt);
    if (secEl && secResetAt) secEl.textContent = formatScheduleWeek(secResetAt);
  }, 10000);
}

window.onload = function() {
  const k = getUrlKey();
  if (k) {
    document.getElementById("apiKeyInput").value = k;
    doQuery();
  }
};

async function doQuery() {
  const turn = ++queryGeneration;
  currentKey = document.getElementById("apiKeyInput").value.trim();
  const key = currentKey;
  if (countdownTimer) clearInterval(countdownTimer);
  const area = document.getElementById("resultArea");
  if (!currentKey) {
    area.innerHTML = '<div class="alert alert-err">请输入有效的 API Key</div>';
    return;
  }
  area.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--muted);">正在连接网关查询真实状态...</div>';

  try {
    const { res, data: d } = await api("api/status");
    if (turn !== queryGeneration || key !== currentKey) return;
    if (!res.ok || d.error) {
      area.innerHTML = '<div class="alert alert-err">查询失败：' + esc(d.error || "未找到此 Key") + '</div>';
      return;
    }

    const quotaSupported = d.quota_supported !== false;
    const pri = d.upstream_usage?.rate_limit?.primary_window || {};
    const sec = d.upstream_usage?.rate_limit?.secondary_window || {};
    const credCount = d.credits_available ?? 0;
    const isCooling = d.is_cooling;

    let statusBadge = '<span class="badge badge-green">正常运行</span>';
    if (isCooling || pri.used_percent >= 100 || sec.used_percent >= 100) {
      statusBadge = '<span class="badge badge-red">额度触顶 (冷却中)</span>';
    }

    let html = '<div class="overview-grid"><div class="status-card"><div class="panel-title">席位状态</div>';
    html += '<div class="stat-row"><span class="stat-label">绑定席位</span><span class="stat-val">' + esc(d.seat_name) + '</span></div>';
    html += '<div class="stat-row"><span class="stat-label">网关状态</span><span class="stat-val">' + statusBadge + '</span></div>';
    if (d.last_auto_clear_at) {
      html += '<div class="stat-row"><span class="stat-label">上次自动解除冷却</span><span class="stat-val">' + esc(formatDate(d.last_auto_clear_at)) + '</span></div>';
    }
    if (d.expires_at) {
      html += '<div class="stat-row"><span class="stat-label">租期到期</span><span class="stat-val">' + esc(formatDate(d.expires_at)) + '</span></div>';
    }
    const lim = d.limits || {};
    html += '<div class="stat-row"><span class="stat-label">并发请求</span><span class="stat-val">' + esc(formatLimit(lim.active, lim.max_concurrency)) + '</span></div>';
    html += '<div class="stat-row"><span class="stat-label">近 1 分钟请求</span><span class="stat-val">' + esc(formatLimit(lim.recent_requests, lim.rpm)) + '</span></div>';
    html += '</div><div class="status-card"><div class="panel-title">上游额度</div>';
    if (quotaSupported) {
      html += '<div class="stat-row"><span class="stat-label">5小时滚动已用</span><span class="stat-val">' + esc(pri.used_percent !== undefined ? pri.used_percent + "%" : "暂不可用") + '</span></div>';
      if (pri.reset_at) {
        html += '<div class="stat-row"><span class="stat-label">⏱️ 5小时额度刷新倒计时</span><span class="stat-val" id="priCountdown" style="color: var(--accent);">' + formatRemaining5h(pri.reset_at) + '</span></div>';
      }
      html += '<div class="stat-row"><span class="stat-label">周限额已用</span><span class="stat-val">' + esc(sec.used_percent !== undefined ? sec.used_percent + "%" : "暂不可用") + '</span></div>';
      if (sec.reset_at) {
        html += '<div class="stat-row"><span class="stat-label">📅 周限额度刷新时间</span><span class="stat-val" id="secSchedule" style="color: var(--accent);">' + formatScheduleWeek(sec.reset_at) + '</span></div>';
      }
    } else {
      html += '<div class="stat-row"><span class="stat-label">额度窗口</span><span class="stat-val" style="color: var(--muted);">该席位类型暂不支持额度查询</span></div>';
    }
    html += '</div><div class="status-card"><div class="panel-title">历史用量</div>';
    const totalTok = d.total_tokens || 0;
    const inputTok = d.input_tokens || 0;
    const outputTok = d.output_tokens || 0;
    const cachedTok = d.cached_tokens || 0;
    const usageAvailable = d.usage_available !== false;
    const tokens = (n) => usageAvailable ? formatTokensM(n) : "--";

    html += '<div class="stat-row"><span class="stat-label">当前 Key 历史调用</span><span class="stat-val">' + (usageAvailable ? esc(d.local_calls || 0) + ' 次 · 总计 ' + tokens(totalTok) + ' tokens' : '统计暂不可用') + '</span></div>';
    if (!usageAvailable) html += '<div class="alert alert-err">历史用量暂不可用，请稍后重试或联系车主。此状态不表示用量为 0。</div>';
    html += '<div class="token-grid">';
    html += '<div class="token-col"><div class="token-lbl">输入 (Input)</div><div class="token-val" style="color:var(--text);">' + tokens(inputTok) + '</div></div>';
    html += '<div class="token-col token-col-mid"><div class="token-lbl">输出 (Output)</div><div class="token-val" style="color:var(--accent);">' + tokens(outputTok) + '</div></div>';
    html += '<div class="token-col"><div class="token-lbl">缓存读取 (Hit)</div><div class="token-val" style="color:var(--green);">' + tokens(cachedTok) + '</div></div>';
    html += '</div>';

    html += '<button class="monitor-link" onclick="openMonitor()">查看请求监控 ↗</button>';
    if (quotaSupported) {
      html += '<div class="stat-row"><span class="stat-label">可用撞墙重置卡</span><span class="stat-val" style="color: var(--orange);">' + esc(credCount) + ' 张</span></div>';
    }
    html += '</div></div>';

    if (quotaSupported) {
      html += '<div class="reset-sec">';
      html += '<button class="reset-btn" ' + (credCount <= 0 ? "disabled" : "") + ' onclick="doReset()">';
      html += (credCount > 0 ? "⚡ 一键核销重置卡并解除冷却 (剩余 " + esc(credCount) + " 次)" : "暂无可用重置卡");
      html += '</button>';
      html += '<div style="font-size:12px; color:var(--muted); margin-top:8px; line-height:1.4;">* 说明：当写代码撞限（429 Too Many Requests）时，点击此按钮可立即消耗一张官方重置卡瞬间满血复活。请按需合理使用。</div>';

      const creditsList = d.credits_list || [];
      if (creditsList.length > 0) {
        html += '<div style="margin-top: 18px;">';
        html += '<div style="font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px;">重置卡使用时间与明细</div>';
        html += '<div class="credit-list">';
        creditsList.forEach((c) => {
          const isRedeemed = c.status === "redeemed" || (c.redeemed_at && c.redeemed_at !== "");
          const badge = isRedeemed
            ? '<span class="badge badge-orange">已使用</span>'
            : '<span class="badge badge-green">可使用</span>';

          html += '<div class="credit-item">';
          html += '<div class="credit-header">';
          html += '<span class="credit-title">' + esc(c.title || "额度重置卡") + '</span>';
          html += badge;
          html += '</div>';
          html += '<div class="credit-meta">';
          html += '<div><span>发放时间</span><span class="val">' + esc(formatDate(c.granted_at)) + '</span></div>';
          if (isRedeemed) {
            html += '<div><span style="color:var(--orange);">使用时间</span><span class="val" style="color:var(--orange); font-weight:600;">' + esc(formatDate(c.redeemed_at)) + '</span></div>';
          } else {
            html += '<div><span>有效期至</span><span class="val" style="color:var(--accent);">' + esc(formatDate(c.expires_at)) + '</span></div>';
          }
          html += '</div>';
          html += '</div>';
        });
        html += '</div></div>';
      } else {
        html += '<div style="font-size: 12px; color: var(--muted); margin-top: 14px; text-align: center;">暂无已发放的重置卡记录</div>';
      }

      html += '</div>';
    }

    html += '<details class="guide-details"><summary>客户端接入配置 <span style="color:var(--muted);font-size:12px;font-weight:400;"> · 展开查看与复制</span></summary><div class="guide-sec" id="guideSec"></div></details>';

    area.innerHTML = html;
    if (pri.reset_at || sec.reset_at) {
      startCountdown(pri.reset_at, sec.reset_at);
    }
    setupGuide(d);
  } catch(e) {
    if (turn !== queryGeneration) return;
    area.innerHTML = '<div class="alert alert-err">网络错误：' + esc(e.message) + '</div>';
  }
}

function openMonitor() { if (currentKey) window.location.assign("monitor#key=" + encodeURIComponent(currentKey)); }

// Usage is only counted while some seat has a limit, so unlimited shows no count.
function formatLimit(used, limit) {
  return Number(limit) > 0 ? (Number(used) || 0) + " / " + limit : "不限";
}

// ---- Client setup guide -------------------------------------------------
// Everything is rendered client-side from the gateway address, the buyer's own key
// and a model picked from /v1/models; nothing new is sent to the server.

// The gateway root is the part of the path before /v0/resource/plugins/, so the
// guide still works when CPA sits under a reverse-proxy path prefix.
const gatewayRoot = window.location.pathname.split("/v0/resource/plugins/")[0].replace(/\/+$/, "");

const guide = { tab: "codex", base: "", models: [], model: "", provider: "", blocks: [] };

// Model hints per seat type: models whose id or owner matches are listed first.
const providerHints = {
  codex: ["gpt", "codex", "openai"],
  claude: ["claude", "anthropic"],
  gemini: ["gemini", "google"],
  "gemini-cli": ["gemini", "google"],
  vertex: ["gemini", "google"],
  aistudio: ["gemini", "google"],
  antigravity: ["gemini", "claude", "google"],
  qwen: ["qwen"],
};

function modelMatches(m, provider) {
  const hints = providerHints[provider] || [];
  const text = (String(m.id || "") + " " + String(m.owned_by || "")).toLowerCase();
  return hints.some((h) => text.includes(h));
}

async function loadModels() {
  try {
    const res = await fetch(gatewayRoot + "/v1/models", {
      cache: "no-store",
      headers: { "Authorization": "Bearer " + currentKey }
    });
    if (!res.ok) return [];
    const body = await res.json();
    const list = Array.isArray(body.data) ? body.data : [];
    return list.filter((m) => m && typeof m.id === "string" && m.id);
  } catch (e) {
    return [];
  }
}

async function setupGuide(status) {
  const turn = queryGeneration;
  guide.models = [];
  guide.model = "";
  guide.base = (status.public_base_url || (window.location.origin + gatewayRoot)).replace(/\/+$/, "");
  guide.provider = status.provider || "";
  renderGuide();
  const models = await loadModels();
  if (turn !== queryGeneration) return;
  const matched = models.filter((m) => modelMatches(m, guide.provider));
  const rest = models.filter((m) => !modelMatches(m, guide.provider));
  guide.models = matched.concat(rest).map((m) => m.id);
  if (!guide.model || !guide.models.includes(guide.model)) {
    guide.model = guide.models[0] || "";
  }
  renderGuide();
}

function tomlStr(s) { return JSON.stringify(String(s)); }
function shStr(s) { return '"' + String(s).replace(/[\\"$`]/g, "\\$&") + '"'; }

function guideTemplates() {
  const base = guide.base, key = currentKey, model = guide.model || "<模型名>";
  return {
    codex: [
      { step: "1. 编辑 ~/.codex/config.toml（Windows 为 %USERPROFILE%\\.codex\\config.toml），已有 model / model_provider 时替换掉：",
        code: "model_provider = \"carpool\"\nmodel = " + tomlStr(model) + "\n\n[model_providers.carpool]\nname = \"CPA Carpool\"\nbase_url = " + tomlStr(base + "/v1") + "\nwire_api = \"responses\"\nenv_key = \"CARPOOL_API_KEY\"" },
      { step: "2. 设置环境变量。macOS / Linux 写进 ~/.zshrc 或 ~/.bashrc：",
        code: "export CARPOOL_API_KEY=" + shStr(key) },
      { step: "Windows（PowerShell 或 CMD，执行后重新打开终端）：",
        code: "setx CARPOOL_API_KEY \"" + key + "\"" },
    ],
    claude: [
      { step: "写入 ~/.claude/settings.json（已有内容时只合并 env 部分）：",
        code: JSON.stringify({ env: {
          ANTHROPIC_BASE_URL: base,
          ANTHROPIC_AUTH_TOKEN: key,
          ANTHROPIC_MODEL: model,
          ANTHROPIC_DEFAULT_HAIKU_MODEL: model,
        } }, null, 2),
        note: "ANTHROPIC_DEFAULT_HAIKU_MODEL 让后台小任务也使用这个模型，避免请求到席位不支持的模型。席位不是 Claude 账号时，CPA 会把 Claude 协议的请求转换后发给席位账号。" },
    ],
    cursor: [
      { steps: [
          "打开 Cursor Settings → Models。",
          "在 API Keys 的 OpenAI API Key 中填入你的 key：",
          "打开 Override OpenAI Base URL，填入：",
          "点击 Add Custom Model 添加模型，保存后点击 Verify：",
        ],
        values: [null, key, base + "/v1", model],
        note: "Cursor 通过它自己的服务器转发请求，接口地址必须能从公网通过 HTTPS 访问；只在内网可达的网关无法用于 Cursor。" },
    ],
    generic: [
      { step: "任何 OpenAI 兼容客户端：Base URL 填 " + base + "/v1，API Key 填你的 key。用下面的命令测试连通性：",
        code: "curl " + base + "/v1/chat/completions \\\n  -H " + shStr("Authorization: Bearer " + key) + " \\\n  -H \"Content-Type: application/json\" \\\n  -d '" + JSON.stringify({ model: model, messages: [{ role: "user", content: "ping" }] }) + "'" },
    ],
  };
}

function codeBlock(text) {
  guide.blocks.push(text);
  return '<div class="code-box"><pre>' + esc(text) + '</pre><button class="copy-btn" data-copy="' + (guide.blocks.length - 1) + '">复制</button></div>';
}

function renderGuide() {
  const sec = document.getElementById("guideSec");
  if (!sec) return;
  guide.blocks = [];
  const tabs = [["codex", "Codex CLI"], ["claude", "Claude Code"], ["cursor", "Cursor"], ["generic", "OpenAI 兼容 / curl"]];

  let html = '<div class="sec-title">客户端接入</div>';
  html += '<div class="sec-desc">下面的配置已经填好了网关地址和你的 key，复制即可使用。请勿把含 key 的配置分享给他人。</div>';
  html += '<div class="guide-field"><label>接口地址</label><code>' + esc(guide.base) + '</code></div>';
  html += '<div class="guide-field"><label>模型</label>';
  if (guide.models.length > 0) {
    html += '<select id="guideModel">' + guide.models.map((id) =>
      '<option value="' + esc(id) + '"' + (id === guide.model ? " selected" : "") + '>' + esc(id) + '</option>').join("") + '</select>';
  } else {
    html += '<input type="text" id="guideModel" placeholder="填写要使用的模型名" value="' + esc(guide.model) + '" spellcheck="false">';
  }
  html += '</div>';

  html += '<div class="tabs">' + tabs.map(([id, label]) =>
    '<button class="tab' + (id === guide.tab ? " active" : "") + '" data-tab="' + id + '">' + esc(label) + '</button>').join("") + '</div>';

  (guideTemplates()[guide.tab] || []).forEach((b) => {
    if (b.steps) {
      html += '<ol class="guide-steps">';
      b.steps.forEach((s, i) => {
        html += '<li>' + esc(s) + (b.values[i] ? codeBlock(b.values[i]) : '') + '</li>';
      });
      html += '</ol>';
    } else {
      html += '<div class="step">' + esc(b.step) + '</div>' + codeBlock(b.code);
    }
    if (b.note) html += '<div class="guide-note">' + esc(b.note) + '</div>';
  });
  sec.innerHTML = html;
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // Clipboard API needs HTTPS; fall back to a temporary textarea.
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  const old = btn.textContent;
  btn.textContent = "已复制";
  setTimeout(() => { btn.textContent = old; }, 1500);
}

document.addEventListener("click", (ev) => {
  const tab = ev.target.closest && ev.target.closest(".tab[data-tab]");
  if (tab) {
    guide.tab = tab.dataset.tab;
    renderGuide();
    return;
  }
  const btn = ev.target.closest && ev.target.closest(".copy-btn[data-copy]");
  if (btn) {
    copyText(guide.blocks[Number(btn.dataset.copy)] || "", btn);
  }
});

document.addEventListener("input", (ev) => {
  if (ev.target && ev.target.id === "apiKeyInput") {
    queryGeneration++;
    currentKey = "";
    guide.blocks = [];
    document.getElementById("resultArea").innerHTML = "";
    if (countdownTimer) clearInterval(countdownTimer);
  }
});

document.addEventListener("change", (ev) => {
  if (ev.target && ev.target.id === "guideModel") {
    guide.model = ev.target.value.trim();
    renderGuide();
  }
});

async function doReset() {
  if (!currentKey) return;
  if (!confirm("确定要消耗 1 张重置卡立即回满额度吗？")) return;
  const area = document.getElementById("resultArea");
  area.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--orange);">正在调用 OpenAI 上游核销重置卡并同步解除网关冷却...</div>';

  try {
    // CPA only routes GET to plugin resources; confirm=1 marks the request as intentional.
    const { data: d } = await api("api/reset?confirm=1");
    if (d.success) {
      alert("🎉 " + (d.message || "重置成功"));
    } else {
      alert("重置失败：" + (d.error || "未知原因"));
    }
  } catch(e) {
    alert("请求失败：" + e.message);
  }
  doQuery();
}
</script>
