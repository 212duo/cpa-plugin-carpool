name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Embedded page behavior
        run: node --test scripts/admin.test.cjs scripts/portal.test.cjs

      - name: Check the tag matches PluginVersion
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "PluginVersion = \"$version\"" types.go; then
            echo "types.go PluginVersion does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test and build in golang:1.26-bookworm
        run: sh ./build.sh test

      - name: Package
        run: |
          name="cpa-carpool_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp out/cpa-carpool.so LICENSE README.md README.en.md CHANGELOG.md config.example.yaml "dist/$name/"
          mkdir -p "dist/$name/docs" && cp -r docs/images "dist/$name/docs/"
          sh scripts/third_party_licenses.sh "dist/$name/third_party_licenses"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # CLIProxyAPI's plugin store installs <id>_<version>_<goos>_<goarch>.zip
          # and requires the library at the zip root.
          command -v zip >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq zip unzip; }
          (cd "dist/$name" && zip -qr "../$name.zip" .)
          unzip -Z1 "dist/$name.zip" | grep -qx 'cpa-carpool.so'

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The plugin store verifies its zip against checksums.txt.
      - name: Checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
