<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
  <title id="title">cpa-plugin-carpool architecture</title>
  <desc id="desc">Client requests pass CLIProxyAPI key authentication and reach the scheduler, where cpa-carpool routes each managed key only to its bound account and rejects otherwise; unmanaged keys fall back to the built-in scheduler. The buyer portal is served through GET resource routes and reads credentials and cooldown state through host callbacks, and Codex quota from chatgpt.com.</desc>
  <defs>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #f8fafc; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12px; fill: #94a3b8; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; font-size: 11.5px; fill: #cbd5e1; }
    .lbl { font-size: 11.5px; fill: #94a3b8; }
    .box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
    .core { fill: #111a2e; stroke: #334155; stroke-width: 1.2; }
  </style>

  <rect width="1000" height="600" rx="16" fill="#0f172a"/>

  <!-- Left: callers -->
  <rect class="box" x="24" y="96" width="210" height="104" rx="10"/>
  <text class="h" x="40" y="124">AI clients</text>
  <text class="s" x="40" y="146">Codex CLI · Cursor · Claude Code</text>
  <text class="m" x="40" y="176">Bearer sk-buyer-…</text>

  <rect class="box" x="24" y="380" width="210" height="96" rx="10"/>
  <text class="h" x="40" y="408">Buyer's browser</text>
  <text class="s" x="40" y="430">Self-service portal</text>
  <text class="m" x="40" y="458">…/portal#key=sk-…</text>

  <!-- Middle: CLIProxyAPI -->
  <rect x="268" y="36" width="456" height="532" rx="14" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="h" x="286" y="64" style="font-size:16px">CLIProxyAPI v8</text>

  <rect class="core" x="286" y="96" width="176" height="56" rx="9"/>
  <text class="h" x="300" y="120" style="font-size:14px">Key authentication</text>
  <text class="m" x="300" y="140">access.api-keys</text>

  <rect class="core" x="286" y="192" width="176" height="56" rx="9"/>
  <text class="h" x="300" y="216" style="font-size:14px">Scheduler</text>
  <text class="m" x="300" y="236">scheduler.pick</text>

  <rect class="core" x="286" y="288" width="176" height="56" rx="9" stroke-dasharray="4 4"/>
  <text class="h" x="300" y="312" style="font-size:14px">Built-in scheduler</text>
  <text class="s" x="300" y="332">all accounts</text>

  <rect class="core" x="286" y="384" width="176" height="56" rx="9"/>
  <text class="h" x="300" y="408" style="font-size:14px">Resource routes</text>
  <text class="s" x="300" y="428">GET only, no admin key</text>

  <rect class="core" x="286" y="480" width="176" height="64" rx="9"/>
  <text class="h" x="300" y="504" style="font-size:14px">Auth manager</text>
  <text class="s" x="300" y="524">credentials · cooldown</text>

  <!-- Plugin -->
  <rect x="486" y="84" width="222" height="470" rx="12" fill="#0c2233" stroke="#38bdf8" stroke-width="1.6"/>
  <text class="h" x="502" y="110" style="fill:#38bdf8">cpa-carpool.so</text>

  <rect class="box" x="500" y="124" width="194" height="110" rx="9"/>
  <text class="h" x="514" y="148" style="font-size:14px">Seat router</text>
  <text class="m" x="514" y="170">key → seat → auth ID</text>
  <text class="s" x="514" y="194">exact match</text>
  <text class="s" x="514" y="214">fail-closed</text>

  <rect class="box" x="500" y="252" width="194" height="98" rx="9"/>
  <text class="h" x="514" y="276" style="font-size:14px">Config loader</text>
  <text class="m" x="514" y="298">configs.cpa-carpool</text>
  <text class="s" x="514" y="320">strict parsing</text>
  <text class="s" x="514" y="338">any error → reject all</text>

  <rect class="box" x="500" y="372" width="194" height="80" rx="9"/>
  <text class="h" x="514" y="396" style="font-size:14px">Portal</text>
  <text class="m" x="514" y="418">/portal  /api/status</text>
  <text class="m" x="514" y="438">/api/reset?confirm=1</text>

  <rect class="box" x="500" y="470" width="194" height="74" rx="9"/>
  <text class="h" x="514" y="494" style="font-size:14px">Host callbacks</text>
  <text class="m" x="514" y="514">host.auth.* · host.log</text>
  <text class="m" x="514" y="532">routing.reset_cooldown</text>

  <!-- Right: outcomes -->
  <rect class="box" x="756" y="96" width="220" height="104" rx="10" stroke="#22c55e"/>
  <text class="h" x="772" y="124">Bound account only</text>
  <text class="s" x="772" y="148">Seat 1 → Team account A</text>
  <text class="s" x="772" y="170">Seat 2 → Team account B</text>

  <rect class="box" x="756" y="226" width="220" height="86" rx="10" stroke="#ef4444"/>
  <text class="h" x="772" y="254">Rejected</text>
  <text class="s" x="772" y="276">seat expired · account unavailable</text>
  <text class="s" x="772" y="296">invalid plugin config</text>

  <rect class="box" x="756" y="372" width="220" height="80" rx="10" stroke="#f59e0b"/>
  <text class="h" x="772" y="400">chatgpt.com</text>
  <text class="s" x="772" y="422">quota windows · reset credits</text>
  <text class="s" x="772" y="440">Codex seats, cached 30 s</text>

  <!-- Request flow -->
  <path d="M234 136 H280" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a-muted)"/>
  <path d="M374 152 V186" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a-muted)"/>
  <path d="M462 214 H480 V182 H494" stroke="#38bdf8" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
  <path d="M694 152 H750" stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
  <path d="M694 210 H738 V268 H750" stroke="#ef4444" stroke-width="1.6" fill="none" marker-end="url(#a-red)"/>
  <path d="M500 226 H476 V316 H468" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#a-muted)"/>
  <text class="lbl" x="372" y="282" text-anchor="middle">unmanaged key</text>

  <!-- Portal flow -->
  <path d="M234 424 H280" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a-muted)"/>
  <path d="M462 412 H494" stroke="#38bdf8" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
  <path d="M597 452 V464" stroke="#38bdf8" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
  <path d="M500 512 H468" stroke="#38bdf8" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
  <path d="M694 412 H750" stroke="#f59e0b" stroke-width="1.6" fill="none" marker-end="url(#a-orange)"/>
</svg>
